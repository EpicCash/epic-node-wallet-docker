services:
  epic-node-wallet:
    container_name: "epic-node-wallet"
    entrypoint:
      - "/home/epicsvcs/entrypoint.sh"
    environment:
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "LANG=en_US.UTF-8"
      - "LANGUAGE=en_US:en"
    hostname: "epic-node-wallet"
    image: "epic-node-wallet"
    ipc: "private"
    labels:
      org.opencontainers.image.ref.name: "ubuntu"
      org.opencontainers.image.version: "24.04"
    logging:
      driver: "json-file"
      options: {}
    mac_address: "96:03:d7:bf:e5:03"
    network_mode: "bridge"
    ports:
      - "3413:3413/tcp"
      - "3414:3414/tcp"
    user: "epicsvcs"
    volumes:
      - "epicdata:/home/epicsvcs/.epic/main"
    working_dir: "/home/epicsvcs"
version: "3.6"
volumes:
  epicdata:
    external: true

